name: jspx-rust-v1

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: jspx-rust-v1:local
    ports:
      - "127.0.0.1:${JSPX_PORT:-8088}:8080"
    environment:
      JSPX_BIND: 0.0.0.0:8080
      JSPX_DB: /data/history.redb
    volumes:
      - rust-history:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  rust-history:
