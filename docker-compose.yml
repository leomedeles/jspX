services:
  influxdb:
    image: influxdb:2.7
    ports: ["127.0.0.1:8086:8086"]
    restart: unless-stopped
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: jspX
      DOCKER_INFLUXDB_INIT_BUCKET: scada
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}

  grafana:
    image: grafana/grafana:10.4.5
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      INFLUXDB_READ_TOKEN: ${INFLUXDB_READ_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_URL: ${INFLUXDB_URL}

  nodered:
    build:
      context: .
      dockerfile: nodered/Dockerfile
    image: jspx-nodered:4.1.0-dashboard-3.6.6
    ports: ["127.0.0.1:1880:1880"]
    restart: unless-stopped
    volumes:
      - nodered-data:/data
      - type: bind
        source: ./nodered/data/flows.json
        target: /data/flows.json
        bind:
          create_host_path: false
    environment:
      - INFLUXDB_WRITE_TOKEN=${INFLUXDB_WRITE_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - INFLUXDB_URL=${INFLUXDB_URL}
    depends_on: [influxdb]

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["127.0.0.1:1883:1883"]
    restart: unless-stopped
    volumes:                            # Persist and inject config/data for reproducibility
      - ./mqtt/config/mqtt.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  sim:
    build:
      context: .
      dockerfile: dockerfile
    depends_on:
      - mosquitto
    restart: unless-stopped
    environment:
      BROKER_URL: ${MQTT_BROKER_URL:-mqtt://mosquitto:1883}
      PUB_TOPIC: ${MQTT_PUB_TOPIC:-telemetry/pandapower}
      RATE_HZ: ${SIM_RATE_HZ:-1}
    command:
      - python
      - src/power_sim.py
      - --mqtt
      - --pandapower


volumes:
  influxdb-data:  
  influxdb-config:
  grafana-data:
  nodered-data:
  mosquitto-data:
  mosquitto-log:
