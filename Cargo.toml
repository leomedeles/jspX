[package]
name = "jspx"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
nalgebra = "0.34"
num-complex = "0.4"
redb = "4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }

